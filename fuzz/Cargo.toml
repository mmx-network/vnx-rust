[package]
name = "vnx-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
libc = "0.2"
vnx = { path = "../crates/vnx" }

[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bytecode"
path = "fuzz_targets/bytecode.rs"
test = false
doc = false
bench = false
